services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NUXT_MONGODB_URI: ${MONGODB_URI}
      NUXT_JWT_SECRET: ${JWT_SECRET}
      NUXT_JWT_EXPIRE: ${JWT_EXPIRE:-30d}
      NUXT_ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NUXT_ADMIN_EMAIL: ${ADMIN_EMAIL}
      NUXT_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NUXT_ADMIN_NAME: ${ADMIN_NAME:-Admin}
      NUXT_PUBLIC_APP_URL: ${APP_URL}
      NUXT_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      NUXT_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NUXT_GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      NUXT_MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      NUXT_MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      NUXT_MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      NUXT_MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
      NUXT_BACKUP_TMP_DIR: /tmp/mongo-backup
      NUXT_BACKUP_LOCAL_DIR: /data/local-backups
      NUXT_MONGODUMP_BIN: mongodump
      NUXT_SCHEDULER_ENABLED: "true"
      MACHINE_ID: ${MACHINE_ID:-}
      NODE_ENV: production
    ports:
      - "13280:13280"
    volumes:
      - backup_tmp:/tmp/mongo-backup
      - backup_local:/data/local-backups
      - /etc/machine-id:/etc/machine-id:ro
    networks:
      - default
      - metrixcrm_default

volumes:
  backup_tmp:
  backup_local:

networks:
  metrixcrm_default:
    external: true
